name: CI

on:
  push:
    branches: [dev,main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-service
          - config-service
          - gateway-service
          - weather-service
          - iot-service
          - data-aggregation-service
          - ai-agent-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B -q package -DskipTests

  frotend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecowatch-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path:  ecowatch-frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production