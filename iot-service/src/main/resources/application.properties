spring.application.name=iot-service
server.port=8083
spring.datasource.url=jdbc:h2:mem:iot_db
spring.h2.console.enabled=true

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

iot.scheduler.water.rate=3600000
iot.scheduler.sensor.rate=600000
iot.scheduler.initial.delay=30000
iot.scheduler.alert.rate=6000000

iot.alert.air.quality.max=150
iot.alert.poussiere.max=75
iot.alert.water.level.crtitique=20
iot.alert.water.level.low=40
iot.alert.temperature.max=40
iot.alert.temperature.min=0
iot.alert.co2.max=1000
iot.alert.humiditySol.max=30

